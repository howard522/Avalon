name: avalon
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: "^3.7.2"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  flip_card: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.4
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  flutter_launcher_icons: ^0.11.0

flutter_icons:            # ← 與 dev_dependencies 平行
  android: true
  ios:    true
  image_path: "assets/app_icon/app_icon.png"
  # 如果要設定 adaptive icon，可加：
  # android_adaptive_icon_background: "#ffffff"
  # android_adaptive_icon_foreground: "assets/app_icon/app_icon.png"

flutter:
  uses-material-design: true

  # 字體
  fonts:
    - family: MedievalSharp
      fonts:
        - asset: assets/fonts/MedievalSharp-Regular.ttf
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Regular.ttf

  # 資產
  assets:
    - assets/images/
    - assets/images/round_tokens/
    - assets/images/buttons/
    - assets/images/icons/
    - assets/images/textures/
    - assets/images/cards/
    - assets/images/tokens/
    - assets/images/roles/
    - assets/images/plaques/
    - assets/images/decor/

